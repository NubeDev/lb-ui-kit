# `@nube/dash-kit` is ONE package, not a workspace of many. A consumer pins the repo with a single
# `github:NubeDev/lb-ui-kit#kit-vX.Y.Z` dep, and a `github:` dep resolves exactly ONE `package.json` —
# so every surface the kit ships (cache, timerange, source-picker, insights, panel, nav-rail) is a
# folder under `src/`, reachable through this package's exports, never a sub-package. That is also
# what keeps "one React, one query-core" mechanical rather than aspirational.
#
# This file exists only to carry the install policy the whole family shares.

# pnpm 11 blocks postinstall/build scripts by default. esbuild must be approved or vite install stalls.
# TRAP: `pnpm install` re-appends a BROKEN `allowBuilds: {esbuild: set this to true or false}` stub —
# if you see that, fix it back to `esbuild: true`.
allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild

overrides:
  # ONE @tanstack/query-core in the tree, matching the pin `rubix-ai/ui/pnpm-workspace.yaml` carries.
  # Two copies mean two structurally-incompatible `QueryClient`/`Query` types — the class carries a
  # private field, so TS rejects passing one host's client to the other's persister, and the failure
  # reads as an inscrutable private-field error rather than a cache miss. `scripts/assert-single-copy.mjs`
  # fails the build if a second copy ever lands here.
  "@tanstack/query-core": "5.101.4"
  # Force React types to 18 across the tree. A dep whose peer range admits React 19 otherwise lets pnpm
  # hoist a second @types/react@19 that collides with the React 18 JSX types every consumer runs.
  "@types/react": "18.3.31"
  "@types/react-dom": "18.3.7"
